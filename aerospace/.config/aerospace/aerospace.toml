start-at-login = true
after-startup-command = [
  'exec-and-forget borders active_color=0xff39ff14 width=5.0'
]
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[mode.main.binding]
    alt-enter = 'exec-and-forget open -a "alacritty"'

    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-x = 'split horizontal'
    alt-y = 'split vertical'

    alt-f = 'fullscreen'

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-q = 'workspace 5'
    alt-w = 'workspace 6'
    alt-e = 'workspace 7'
    alt-r = 'workspace 8'

    alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    alt-shift-q = ['move-node-to-workspace 5', 'workspace 5']
    alt-shift-w = ['move-node-to-workspace 6', 'workspace 6']
    alt-shift-e = ['move-node-to-workspace 7', 'workspace 7']
    alt-shift-r = ['move-node-to-workspace 8', 'workspace 8']

    alt-m = 'mode modify'

    alt-shift-c = 'reload-config'

[mode.modify.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    esc = 'mode main'
